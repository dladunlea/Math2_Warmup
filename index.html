<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math 2 Warm Up</title>
<style>
  :root { --teal:#376f7a; --teal2:#4c8c8c; --cream:#fff4e6; --peach:#ffe6cc; --gold:#d99a3d; --ink:#263b40;
          --good:#2f7d4f; --goodbg:#e3f3e8; --bad:#a8432f; --badbg:#fbe5df; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Helvetica Neue", Arial, sans-serif; color:var(--ink); background:var(--cream); }
  .wrap { max-width:720px; margin:0 auto; padding:12px 14px; }
  .card { background:#fff; border:3px solid var(--teal2); border-radius:12px; padding:14px 16px; }
  .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; margin:0 0 10px; }
  .title { margin:0; font-size:1.15rem; font-weight:700; color:var(--teal); }
  .date { font-size:.9rem; color:#5b6b6e; }
  .dots { display:flex; gap:6px; margin:0 0 12px; }
  .dot { flex:1; height:8px; border-radius:4px; background:#e9dccb; }
  .dot.now { background:var(--gold); } .dot.ok { background:var(--good); } .dot.no { background:var(--bad); }
  .skill { font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; color:var(--teal2); font-weight:700; margin:0 0 4px; }
  .tag { display:inline-block; font-size:.75rem; background:var(--peach); border-radius:6px; padding:1px 6px; margin-left:6px; text-transform:none; letter-spacing:0; color:var(--ink); font-weight:600; }
  .q { font-size:1.25rem; font-weight:600; line-height:1.4; margin:0 0 12px; }
  .choices { display:grid; gap:8px; }
  .ch { text-align:left; font:inherit; font-size:1.05rem; padding:.6rem .8rem; border:2px solid #d9c9b3; border-radius:8px; background:#fff; color:var(--ink); cursor:pointer; }
  .ch:hover:not(:disabled) { border-color:var(--teal); background:#f4fbfb; }
  .ch:disabled { cursor:default; }
  .ch.right { border-color:var(--good); background:var(--goodbg); font-weight:700; }
  .ch.wrong { border-color:var(--bad); background:var(--badbg); }
  .fb { margin:12px 0 0; padding:10px 12px; border-radius:8px; line-height:1.4; }
  .fb.ok { background:var(--goodbg); } .fb.no { background:var(--badbg); }
  .btn { display:inline-block; font:inherit; font-size:1.05rem; background:var(--teal); color:#fff; border:none; border-radius:8px; padding:.6rem 1.3rem; cursor:pointer; text-decoration:none; margin-top:12px; }
  .btn:hover { background:#2b5962; }
  .btn.alt { background:var(--gold); }
  .btn.ghost { background:#fff; color:var(--teal); border:2px solid var(--teal); }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  label { display:block; font-weight:600; margin:10px 0 4px; }
  input, select { font:inherit; font-size:1rem; padding:.5rem .6rem; border:2px solid #d9c9b3; border-radius:8px; width:100%; background:#fff; color:var(--ink); }
  .score { font-size:2.4rem; font-weight:800; color:var(--teal); margin:4px 0; }
  .muted { color:#5b6b6e; font-size:.92rem; }
  .review { margin:10px 0 0; padding:0; list-style:none; }
  .review li { padding:6px 0; border-top:1px solid #f1dcc2; font-size:.95rem; }
  .practice { margin-top:14px; padding-top:10px; border-top:2px dashed #e5d3ba; }
  .note { background:var(--peach); border-radius:8px; padding:8px 10px; margin-top:10px; font-size:.92rem; }
</style>
</head>

 halfway between −4 and 10?", "ch": ["3", "7", "6", "−3"], "ans": "A", "expl": "Add and divide by 2: (−4 + 10)/2 = 6/2 = 3.", "calc": "No"}, {"skill": "Averaging", "q": "What is the number exactly halfway between −7 and −1?", "ch": ["−3", "−4", "4", "−8"], "ans": "B", "expl": "(−7 + −1)/2 = −8/2 = −4.", "calc": "No"}, {"skill": "Quadrants", "q": "Which quadrant is the point (−3, 5) in?", "ch": ["Quadrant II", "Quadrant IV", "Quadrant I", "Quadrant III"], "ans": "A", "expl": "x is negative (left) and y is positive (up): Quadrant II.", "calc": "No"}, {"skill": "Quadrants", "q": "Which quadrant is the point (4, −2) in?", "ch": ["Quadrant III", "Quadrant II", "Quadrant I", "Quadrant IV"], "ans": "D", "expl": "x is positive (right) and y is negative (down): Quadrant IV.", "calc": "No"}, {"skill": "Changing signs", "q": "Change the sign of only the y-coordinate of (−3, 4).", "ch": ["(3, −4)", "(3, 4)", "(−3, −4)", "(4, −3)"], "ans": "C", "expl": "Only y changes: (−3, −4).", "calc": "No"}, {"skill": "Changing signs", "q": "Change the sign of only the x-coordinate of (5, −2).", "ch": ["(−5, 2)", "(5, 2)", "(−5, −2)", "(−2, 5)"], "ans": "C", "expl": "Only x changes: (−5, −2).", "calc": "No"}, {"skill": "Switching coordinates", "q": "Switch the x- and y-coordinates of (2, −7).", "ch": ["(−2, 7)", "(−7, 2)", "(7, −2)", "(2, 7)"], "ans": "B", "expl": "The y-value moves to the front: (−7, 2). No signs change.", "calc": "No"}, {"skill": "Multiplying coordinates", "q": "Multiply both coordinates of (−4, −5) by 1.5.", "ch": ["(−6, −7.5)", "(−6, −7)", "(6, 7.5)", "(−2.5, −3.5)"], "ans": "A", "expl": "−4 × 1.5 = −6 and −5 × 1.5 = −7.5.", "calc": "No"}, {"skill": "Multiplying coordinates", "q": "Multiply both coordinates of (3, −2) by 3.", "ch": ["(9, 6)", "(9, −6)", "(3, −6)", "(6, 1)"], "ans": "B", "expl": "3 × 3 = 9 and −2 × 3 = −6.", "calc": "No"}, {"skill": "Adding to coordinates", "q": "Add 3 to x and subtract 5 from y for the point (−1, 2).", "ch": ["(2, 7)", "(−4, 7)", "(−6, 5)", "(2, −3)"], "ans": "D", "expl": "x: −1 + 3 = 2. y: 2 − 5 = −3.", "calc": "No"}, {"skill": "Adding to coordinates", "q": "Add 6 to x and 2 to y for the point (−4, −5).", "ch": ["(−10, −7)", "(−10, −3)", "(2, −7)", "(2, −3)"], "ans": "D", "expl": "x: −4 + 6 = 2. y: −5 + 2 = −3.", "calc": "No"}, {"skill": "Multiplying negatives", "q": "(−6)(−7) = ?", "ch": ["13", "−13", "42", "−42"], "ans": "C", "expl": "A negative times a negative is positive: 42.", "calc": "No"}, {"skill": "Dividing negatives", "q": "−48 ÷ 6 = ?", "ch": ["−8", "8", "42", "−42"], "ans": "A", "expl": "Different signs give a negative: −8.", "calc": "No"}, {"skill": "Order of operations", "q": "2 + 3(4 − 6)² = ?", "ch": ["−10", "−4", "14", "20"], "ans": "C", "expl": "4 − 6 = −2, (−2)² = 4, 3 × 4 = 12, 2 + 12 = 14.", "calc": "No"}, {"skill": "Rounding", "q": "Round 23.6182 to the nearest hundredth.", "ch": ["23.61", "23.62", "23.6", "23.618"], "ans": "B", "expl": "Look at the thousandths digit (8). 5 or more, so round up: 23.62.", "calc": "No"}, {"skill": "Rounding", "q": "Round 7.3846 to the nearest hundredth.", "ch": ["7.4", "7.38", "7.385", "7.39"], "ans": "B", "expl": "Look at the thousandths digit (4). Less than 5, so the hundredths digit stays: 7.38.", "calc": "No"}, {"skill": "Rounding", "q": "Round 13.0457 to the nearest hundredth.", "ch": ["13.046", "13.04", "13.05", "13.0"], "ans": "C", "expl": "Look at the thousandths digit (5). 5 or more, so round up: 13.05.", "calc": "No"}], "C2U5": [{"skill": "Distributive property", "q": "−2(400 − 20p) = ?", "ch": ["800 − 40p", "−800 + 40p", "−800 + 20p", "−800 − 40p"], "ans": "B", "expl": "−2 × 400 = −800 and −2 × (−20p) = +40p.", "calc": "No"}, {"skill": "Distributive property", "q": "3(x − 5) = ?", "ch": ["x − 15", "3x + 15", "3x − 5", "3x − 15"], "ans": "D", "expl": "3 × x = 3x and 3 × (−5) = −15.", "calc": "No"}, {"skill": "Distributive property", "q": "−4(x + 3) = ?", "ch": ["4x − 12", "−4x + 12", "−4x + 3", "−4x − 12"], "ans": "D", "expl": "−4 × essions", "q": "Evaluate 500t − 50t² when t = 7.", "ch": ["−21,000", "1,050", "3,500", "2,450"], "ans": "B", "expl": "500(7) − 50(49) = 3,500 − 2,450 = 1,050. Square before multiplying by 50.", "calc": "No"}, {"skill": "Evaluating expressions", "q": "Evaluate 400 − 20p when p = 15.", "ch": ["−100", "100", "385", "300"], "ans": "B", "expl": "400 − 20(15) = 400 − 300 = 100.", "calc": "No"}, {"skill": "Factor pairs", "q": "Which two numbers multiply to −20 and add to −8?", "ch": ["10 and −2", "4 and −5", "−10 and 2", "−4 and 5"], "ans": "C", "expl": "(−10)(2) = −20 and −10 + 2 = −8.", "calc": "No"}, {"skill": "Factor pairs", "q": "Which two numbers multiply to 15 and add to −8?", "ch": ["−3 and −5", "−1 and −15", "3 and 5", "1 and 15"], "ans": "A", "expl": "(−3)(−5) = 15 and −3 + (−5) = −8.", "calc": "No"}, {"skill": "Factor pairs", "q": "Which two numbers multiply to 6 and add to 5?", "ch": ["−2 and −3", "1 and 6", "2 and 3", "−1 and −6"], "ans": "C", "expl": "(2)(3) = 6 and 2 + 3 = 5.", "calc": "No"}, {"skill": "Factor pairs", "q": "Which two numbers multiply to −30 and add to −7?", "ch": ["6 and −5", "10 and −3", "−10 and 3", "−6 and 5"], "ans": "C", "expl": "(−10)(3) = −30 and −10 + 3 = −7.", "calc": "No"}, {"skill": "Factor pairs", "q": "Which two numbers multiply to −6 and add to 1?", "ch": ["3 and −2", "2 and 3", "6 and −1", "−3 and 2"], "ans": "A", "expl": "(3)(−2) = −6 and 3 + (−2) = 1.", "calc": "No"}, {"skill": "Identifying negatives in exponents", "q": "What is −5²?", "ch": ["−25", "−10", "25", "10"], "ans": "A", "expl": "Only the 5 is squared: −25. (−5)² would be 25.", "calc": "No"}, {"skill": "Identifying negatives in exponents", "q": "What is (−3)²?", "ch": ["−6", "−9", "9", "6"], "ans": "C", "expl": "The whole −3 is squared: (−3)(−3) = 9.", "calc": "No"}, {"skill": "Order of operations", "q": "2 + 3(4 − 6)² = ?", "ch": ["−10", "14", "20", "−4"], "ans": "B", "expl": "4 − 6 = −2, (−2)² = 4, 3 × 4 = 12, 2 + 12 = 14.", "calc": "No"}, {"skill": "Two-step equations", "q": "Solve for x: 3x − 7 = 11", "ch": ["4/3", "−6", "6", "11/3"], "ans": "C", "expl": "Add 7: 3x = 18. Divide by 3: x = 6.", "calc": "No"}, {"skill": "Two-step equations", "q": "Solve for x: 2x + 9 = 3", "ch": ["3", "3/2", "−3", "6"], "ans": "C", "expl": "Subtract 9: 2x = −6. Divide by 2: x = −3.", "calc": "No"}, {"skill": "Variable in the denominator", "q": "Solve for x: 16 = 64/x", "ch": ["4", "48", "1/4", "1,024"], "ans": "A", "expl": "Multiply both sides by x: 16x = 64. Divide by 16: x = 4. Check: 64/4 = 16.", "calc": "No"}, {"skill": "Variable in the denominator", "q": "Solve for x: 5 = 40/x", "ch": ["200", "8", "35", "1/8"], "ans": "B", "expl": "Multiply both sides by x: 5x = 40. Divide by 5: x = 8. Check: 40/8 = 5.", "calc": "No"}, {"skill": "Powers of 10", "q": "10⁴ = ?", "ch": ["1,000", "100,000", "40", "10,000"], "ans": "D", "expl": "Four 10s multiplied: a 1 followed by four zeros.", "calc": "No"}, {"skill": "Powers of 10", "q": "10⁻¹ = ?", "ch": ["−10", "0.1", "1", "−0.1"], "ans": "B", "expl": "A negative exponent means divide: 10⁻¹ = 1/10 = 0.1.", "calc": "No"}, {"skill": "Powers of 10", "q": "10⁰ = ?", "ch": ["0.1", "1", "0", "10"], "ans": "B", "expl": "Any nonzero number to the 0 power is 1.", "calc": "No"}, {"skill": "Exponent rules", "q": "10² × 10³ = ?", "ch": ["20⁵", "10⁵", "10⁶", "100⁵"], "ans": "B", "expl": "Same base, so add the exponents: 2 + 3 = 5.", "calc": "No"}, {"skill": "Inverse operations", "q": "Solve for y: 4y − 5 = 27", "ch": ["6.75", "32", "5.5", "8"], "ans": "D", "expl": "Add 5: 4y = 32. Divide by 4: y = 8.", "calc": "No"}, {"skill": "Inverse operations", "q": "Solve for y: 3y + 7 = 31", "ch": ["12.67", "24", "8", "10"], "ans": "C", "expl": "Subtract 7: 3y = 24. Divide by 3: y = 8.", "calc": "No"}, {"skill": "Inverse operations", "q": "Solve for x: 3x + 1 = 4", "ch": ["5/3", "3", "1/3", "1"], "ans": "D", "expl": "Subtract 1: 3x = 3. Divide by 3: x = 1.", "calc": "No"}, {"skill": "Rounding", "q": "Round 4.3243 to the nearest hundredth.", "ch": ["4.33", "4.324", "4.32", "4.3"], "ans": "C", "expl": "Look at the thousandths digit (4). Less than 5, so the hundredths digit stays: 4.32.", "calc": "No"}, {"skill": "Rounding", "q": "Round 1.6532 to the nearest hundredth.", "ch": ["1.65", "1.653", "1.66", "1.7"], "ans": "A", "expl": "Look at the thousandths digit (3). Less than 5, so the hundredths digit stays: 1.65.", "calc": "No"}, {"skill": "Midpoint of two numbers", "q": "What number is exactly halfway between −5 and 3?", "ch": ["−1", "1", "−4", "4"], "ans": "A", "expl": "(−5 + 3)/2 = −2/2 = −1.", "calc": "No"}], "C2U7": [{"skill": "Pythagorean Theorem", "q": "Use a calculator: a right triangle has legs 3 and 7. To the nearest hundredth, the hypotenuse is", "ch": ["10", "7.62", "58", "6.32"], "ans": "B", "expl": "3² + 7² = 58, and √58 = 7.6158… ≈ 7.62.", "calc": "Yes"}, {"skill": "Pythagorean Theorem", "q": "A right triangle has legs 6 and 8. How long is the hypotenuse?", "ch": ["10", "14", "11", "100"], "ans": "A", "expl": "6² + 8² = 36 + 64 = 100, and √100 = 10.", "calc": "No"}, {"skill": "Pythagorean Theorem", "q": "Use a calculator: a right triangle has legs 4 and 2. To the nearest hundredth, the hypotenuse is", "ch": ["4.47", "20", "6", "3.46"], "ans": "A", "expl": "4² + 2² = 20, and √20 = 4.4721… ≈ 4.47.", "calc": "Yes"}, {"skill": "Pythagorean Theorem", "q": "Use a calculator: a right triangle has legs 10 and 4. To the nearest hundredth, the hypotenuse is", "ch": ["9.17", "14", "116", "10.77"], "ans": "D", "expl": "10² + 4² = 116, and √116 = 10.7703… ≈ 10.77.", "calc": "Yes"}, {"skill": "Pythagorean Theorem", "q": "A right triangle has hypotenuse 13 and one leg 5. How long is the other leg?", "ch": ["√194", "18", "8", "12"], "ans": "D", "expl": "13² − 5² = 169 − 25 = 144, and √144 = 12. Subtract when you're finding a leg.", "calc": "No"}, {"skill": "Solving proportions", "q": "Solve for x: x/15 = 0.53", "ch": ["15.53", "28.30", "0.04", "7.95"], "ans": "D", "expl": "Multiply both sides by 15: x = 15 × 0.53 = 7.95.", "calc": "Yes"}, {"skill": "Solving proportions", "q": "Solve for x: x/30 = 1.38", "ch": ["31.38", "41.40", "0.05", "21.74"], "ans": "B", "expl": "Multiply both sides by 30: x = 30 × 1.38 = 41.40.", "calc": "Yes"}, {"skill": "Solving proportions", "q": "Solve for x: x/22 = 0.62", "ch": ["35.48", "0.03", "22.62", "13.64"], "ans": "D", "expl": "Multiply both sides by 22: x = 22 × 0.62 = 13.64.", "calc": "Yes"}, {"skill": "Solving proportions", "q": "Solve for x: x/70 = 0.58", "ch": ["120.69", "0.01", "70.58", "40.60"], "ans": "D", "expl": "Multiply both sides by 70: x = 70 × 0.58 = 40.60.", "calc": "Yes"}, {"skill": "Variable in the denominator", "q": "Solve for x to the nearest hundredth: 0.62 = 30/x", "ch": ["48.39", "18.60", "48.40", "0.02"], "ans": "A", "expl": "Multiply by x: 0.62x = 30. Divide by 0.62: x = 30 ÷ 0.62 = 48.3871… ≈ 48.39.", "calc": "Yes"}, {"skill": "Variable in the denominator", "q": "Solve for x to the nearest hundredth: 0.84 = 1600/x", "ch": ["190.48", "1904.77", "1344.00", "1904.76"], "ans": "D", "expl": "Multiply by x: 0.84x = 1600. Divide by 0.84: x = 1600 ÷ 0.84 = 1904.7619… ≈ 1904.76.", "calc": "Yes"}, {"skill": "Variable in the denominator", "q": "Solve for x to the nearest hundredth: 0.07 = 8/x", "ch": ["114.29", "114.30", "0.56", "0.01"], "ans": "A", "expl": "Multiply by x: 0.07x = 8. Divide by 0.07: x = 8 ÷ 0.07 = 114.2857… ≈ 114.29.", "calc": "Yes"}, {"skill": "Variable in the denominator", "q": "Solve for x to the nearest hundredth: 0.47 = 75/x", "ch": ["0.01", "35.25", "159.57", "159.58"], "ans": "C", "expl": "Multiply by x: 0.47x = 75. Divide by 0.47: x = 75 ÷ 0.47 = 159.5745… ≈ 159.57.", "calc": "Yes"}, {"skill": "Fractions to decimals", "q": "Write 7/3 as a decimal to the nearest hundredth.", "ch": ["2.3", "2.34", "2.33", "0.43"], "ans": "C", "expl": "7 ÷ 3 = 2.3333… ≈ 2.33.", "calc": "Yes"}, {"skill": "Fractions to decimals", "q": "Write 4/9 as a decimal to the nearest hundredth.", "ch": ["0.4", "2.25", "0.45", "0.44"], "ans": "D", "expl": "4 ÷ 9 = 0.4444… ≈ 0.44.", "calc": "Yes"}, {"skill": "Fractions to decimals", "q": "Write 2/5 as a decimal to the nearest hundredth.", "ch": ["2.50", "0.25", "0.40", "0.41"], "ans": "C", "expl": "2 ÷ 5 = 0.4000… ≈ 0.40.", "calc": "Yes"}, {"skill": "Rounding", "q": "Round 1.3764 to the nearest hundredth.", "ch": ["1.4", "1.37", "1.376", "1.38"], "ans": "D", "expl": "Look at the thousandths digit (6). 5 or more, so round up: 1.38.", "calc": "No"}, {"skill": "Rounding", "q": "Round 48.3871 to the nearest hundredth.", "ch": ["48.39", "48.4", "48.38", "48.387"], "ans": "A", "expl": "Look at the thousandths digit (7). 5 or more, so round up: 48.39.", "calc": "No"}, {"skill": "Rounding", "q": "Round 0.7071 to the nearest hundredth.", "ch": ["0.70", "0.707", "0.71", "0.72"], "ans": "C", "expl": "Look at the thousandths digit (7). 5 or more, so round up: 0.71.", "calc": "No"}, {"skill": "Triangle angle sum", "q": "A right triangle has one angle of 32°. What is the third angle?", "ch": ["90°", "58°", "32°", "148°"], "ans": "B", "expl": "180 − 90 − 32 = 58°.", "calc": "No"}, {"skill": "Triangle angle sum", "q": "A right triangle has one angle of 57°. What is the third angle?", "ch": ["33°", "57°", "123°", "43°"], "ans": "A", "expl": "The two acute angles add to 90°: 90 − 57 = 33°.", "calc": "No"}, {"skill": "Triangle angle sum", "q": "Two angles of a triangle are 40° and 75°. What is the third?", "ch": ["115°", "245°", "35°", "65°"], "ans": "D", "expl": "180 − 40 − 75 = 65°.", "calc": "No"}, {"skill": "Right triangle vocabulary", "q": "In a right triangle, the hypotenuse is", "ch": ["the side across from the smallest angle", "the side across from the right angle", "the side next to the angle you are using", "the shortest side"], "ans": "B", "expl": "The hypotenuse is across from the 90° angle and is the longest side.", "calc": "No"}, {"skill": "Adding heights", "q": "A person's eyes are 5.5 ft above the ground. The tree top is 41.29  multiply by 100: 2/5 = 40%.", "calc": "No"}, {"skill": "Fractions to percents", "q": "Write 3/4 as a percent.", "ch": ["0.75%", "75%", "7.5%", "34%"], "ans": "B", "expl": "Divide, then multiply by 100: 3/4 = 75%.", "calc": "No"}, {"skill": "Decimals to percents", "q": "Write 0.075 as a percent.", "ch": ["7.5%", "75%", "0.075%", "0.75%"], "ans": "A", "expl": "Multiply by 100 (move the decimal two places right).", "calc": "No"}, {"skill": "Decimals to percents", "q": "Write 0.4 as a percent.", "ch": ["4%", "400%", "0.4%", "40%"], "ans": "D", "expl": "Multiply by 100 (move the decimal two places right).", "calc": "No"}, {"skill": "Percents to decimals", "q": "Write 35% as a decimal.", "ch": ["0.035", "35", "3.5", "0.35"], "ans": "D", "expl": "Divide by 100 (move the decimal two places left).", "calc": "No"}, {"skill": "Multiplying decimals", "q": "0.4 × 0.4 = ?", "ch": ["1.6", "0.016", "0.16", "0.8"], "ans": "C", "expl": "4 × 4 = 16, with two decimal places total: 0.16.", "calc": "No"}, {"skill": "Multiplying decimals", "q": "0.6 × 0.4 = ?", "ch": ["2.4", "0.024", "1", "0.24"], "ans": "D", "expl": "6 × 4 = 24, with two decimal places total: 0.24.", "calc": "No"}, {"skill": "Multiplying decimals", "q": "0.2 × 0.8 = ?", "ch": ["1.6", "0.16", "0.016", "1"], "ans": "B", "expl": "2 × 8 = 16, with two decimal places total: 0.16.", "calc": "No"}, {"skill": "Multiplying decimals", "q": "0.3 × 0.3 = ?", "ch": ["0.6", "0.09", "0.9", "0.009"], "ans": "B", "expl": "3 × 3 = 9, with two decimal places total: 0.09.", "calc": "No"}, {"skill": "Multiplying fractions", "q": "2/5 × 3/5 = ?", "ch": ["5/10", "6/5", "5/25", "6/25"], "ans": "D", "expl": "Multiply the tops (2 × 3 = 6) and the bottoms (5 × 5 = 25).", "calc": "No"}, {"skill": "Multiplying fractions", "q": "1/5 × 1/5 = ?", "ch": ["1/25", "1/10", "2/10", "2/5"], "ans": "A", "expl": "Multiply the tops (1) and the bottoms (25). Don't add.", "calc": "No"}, {"skill": "Multiplying fractions", "q": "4/5 × 1/5 = ?", "ch": ["5/10", "5/25", "4/25", "4/5"], "ans": "C", "expl": "Multiply the tops (4 × 1 = 4) and the bottoms (5 × 5 = 25).", "calc": "No"}, {"skill": "Complements", "q": "The chance of rain is 0.35. What is the chance of no rain?", "ch": ["0.65", "1.35", "0.55", "0.35"], "ans": "A", "expl": "All probability adds to 1: 1 − 0.35 = 0.65.", "calc": "No"}, {"skill": "Complements", "q": "The chance of rain is 0.2. What is the chance of no rain?", "ch": ["0.7", "0.8", "0.2", "1.2"], "ans": "B", "expl": "All probability adds to 1: 1 − 0.2 = 0.8.", "calc": "No"}, {"skill": "Complements", "q": "The chance of rain is 0.64. What is the chance of no rain?", "ch": ["0.64", "1.64", "0.36", "0.26"], "ans": "C", "expl": "All probability adds to 1: 1 − 0.64 = 0.36.", "calc": "No"}, {"skill": "Adding fractions", "q": "1/3 + 1/4 = ?", "ch": ["7/12", "1/7", "2/7", "2/12"], "ans": "A", "expl": "Common denominator 12: 4/12 + 3/12 = 7/12.", "calc": "No"}, {"skill": "Adding fractions", "q": "2/5 + 1/2 = ?", "ch": ["2/10", "9/10", "3/10", "3/7"], "ans": "B", "expl": "Common denominator 10: 4/10 + 5/10 = 9/10.", "calc": "No"}, {"skill": "Adding decimals", "q": "0.16 + 0.48 + 0.36 = ?", "ch": ["1.1", "1", "0.64", "0.1"], "ans": "B", "expl": "0.16 + 0.48 = 0.64, and 0.64 + 0.36 = 1. All the outcomes together make 1.", "calc": "No"}, {"skill": "Simplifying fractions", "q": "Simplify 12/48.", "ch": ["4/1", "2/8", "1/4", "1/3"], "ans": "C", "expl": "Divide top and bottom by 12.", "calc": "No"}, {"skill": "Simplifying fractions", "q": "Simplify 35/100.", "ch": ["7/10", "1/3", "35/10", "7/20"], "ans": "D", "expl": "Divide top and bottom by 5.", "calc": "No"}, {"skill": "Simplifying fractions", "q": "Simplify 18/24.", "ch": ["9/24", "3/4", "2/3", "6/8"], "ans": "B", "expl": "Divide top and bottom by 6.", "calc": "No"}, {"skill": "Dividing and rounding", "q": "Use a calculator: 5,373 ÷ 5,959 to the nearest hundredth is", "ch": ["0.89", "0.90", "1.11", "0.91"], "ans": "B", "expl": "5,373 ÷ 5,959 = 0.9017… ≈ 0.90.", "calc": function parseCSV(t){const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++;}else q=false;}else f+=c;}
  else if(c=='"')q=true;else if(c==','){row.push(f);f="";}else if(c=='\n'){row.push(f);r.push(row);row=[];f="";}else if(c!='\r')f+=c;}
  if(f||row.length){row.push(f);r.push(row);}return r;}
function toDate(s){const m=(s||"").match(/(\d{1,2})\/(\d{1,2})/);if(!m)return null;const mo=+m[1],d=+m[2];
  return new Date(mo>=7?SCHOOL_YEAR_START:SCHOOL_YEAR_START+1,mo-1,d);}

/* seeded random so a given warm-up always shows the same questions */
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* "WU C2U5.3a" -> {unit:"C2U5", n:12 (day number in unit, 0-based)} */
function parseWU(title){
  const m=(title||"").match(/WU\s+([A-Z0-9]+)\.(\d+)([a-e])/i); if(!m) return null;
  const unit=m[1].toUpperCase(); if(!BANKS[unit]) return null;
  return {unit, n:(+m[2]-1)*5 + "abcde".indexOf(m[3].toLowerCase())};
}
/* Each student gets their own order through the unit's bank (seeded by their name),
   so classmates see different questions, a refresh shows the same set,
   and a student doesn't repeat a question until they've seen the whole bank. */
function pickSet(title, who){
  const w=parseWU(title); if(!w) return null;
  const bank=BANKS[w.unit], per=Math.max(1,Math.floor(bank.length/PER_DAY));
  const cycle=Math.floor(w.n/per), pos=w.n%per;
  const order=shuffle(bank.map((_,i)=>i), rng(hash(w.unit+"|"+cycle+"|"+(who||"").toLowerCase().replace(/\s+/g," "))));
  return {unit:w.unit, items:order.slice(pos*PER_DAY,pos*PER_DAY+PER_DAY).map(i=>bank[i])};
}
function randomSet(unit, avoid){
  const bank=BANKS[unit], seen=new Set((avoid||[]).map(q=>q.q));
  const fresh=bank.filter(q=>!seen.has(q.q));
  return shuffle(fresh.length>=PER_DAY?fresh:bank, Math.random).slice(0,PER_DAY);
}

function fmtDate(d){return d.toLocaleDateString("en-US",{weekday:"short",month:"numeric",day:"numeric"});}

function prep(items){
  return items.map(q=>({...q, order:shuffle([0,1,2,3],Math.random), correct:"ABCD".indexOf(q.ans)}));
}
/* scored warm-up: ask for name first, then build that student's set */
function begin(title, dateLabel){
  state={title,dateLabel,scored:true,attempt:1,i:0,results:[]};
  intro();
}
/* unscored practice set */
function practice(unit){
  state={title:"Practice: "+(UNIT_NAMES[unit]||unit),dateLabel:"",unit,scored:false,items:prep(randomSet(unit)),i:0,results:[]};
  ask();
}
function attemptKey(){ return "wu_try|"+state.name.toLowerCase()+"|"+state.title; }

function intro(){
  const name=store.get("wu_name"), per=store.get("wu_period");
  app.innerHTML=`
    <div class="top"><p class="title">${esc(state.title)}</p><span class="date">${esc(state.dateLabel)}</span></div>
    <p style="margin:0">${PER_DAY} quick questions on skills you already know. Each one shows the answer and an explanation after you pick.</p>
    <label for="nm">Your name</label><input id="nm" value="${esc(name)}" autocomplete="name">
    <label for="pd">Period</label>
    <select id="pd"><option value="">Choose…</option>${["2","3"].map(p=>`<option ${p===per?"selected":""}>${p}</option>`).join("")}</select>
    <button class="btn" id="go">Start warm-up</button>`;
  document.getElementById("go").onclick=()=>{
    const n=document.getElementById("nm").value.trim(), p=document.getElementById("pd").value;
    if(!n||!p){alert("Please enter your name and period.");return;}
    store.set("wu_name",n); store.set("wu_period",p); state.name=n; state.period=p;
    const s=pickSet(state.title, n); state.unit=s.unit;
    const prev=+store.get(attemptKey())||0;          // came back after finishing? give a new set
    if(prev>=1){ state.attempt=prev+1; state.items=prep(randomSet(s.unit, s.items)); }
    else state.items=prep(s.items);
    ask();
  };
}

function dots(){
  return `<div class="dots">${state.items.map((_,k)=>{
    const r=state.results[k]; return `<span class="dot ${r===true?"ok":r===false?"no":k===state.i?"now":""}"></span>`;}).join("")}</div>`;
}

function ask(){
  const q=state.items[state.i];
  app.innerHTML=`
    <div class="top"><p class="title">${esc(state.title)}</p><span class="date">Question ${state.i+1} of ${state.items.length}</span></div>
    ${dots()}
    <p class="skill">${esc(q.skill)}${q.calc==="Yes"?'<span class="tag">Calculator OK</span>':""}</p>
    <p class="q">${esc(q.q)}</p>
    <div class="choices">${q.order.map(k=>`<button class="ch" data-k="${k}">${esc(q.ch[k])}</button>`).join("")}</div>
    <div id="after"></div>`;
  app.querySelectorAll(".ch").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}

function answer(k){
  const q=state.items[state.i], ok=k===q.correct;
  state.results[state.i]=ok;
  app.querySelectorAll(".ch").forEach(b=>{
    const bk=+b.dataset.k; b.disabled=true;
    if(bk===q.correct) b.classList.add("right"); else if(bk===k) b.classList.add("wrong");
  });
  const last=state.i===state.items.length-1;
  document.getElementById("after").innerHTML=`
    <div class="fb ${ok?"ok":"no"}"><b>${ok?"Correct!":"Not quite."}</b> ${ok?"":"The answer is <b>"+esc(q.ch[q.correct])+"</b>. "}${esc(q.expl)}</div>
    <button class="btn" id="next">${last?"See my score":"Next question"}</button>`;
  app.querySelector(".dots").outerHTML=dots();
  document.getElementById("next").onclick=()=>{ if(last) finish(); else { state.i++; ask(); } };
}

function finish(){
  const right=state.results.filter(Boolean).length, total=state.items.length;
  let submit="";
  const tryLabel=state.attempt>1?` (try ${state.attempt})`:"";
  if(state.scored){
    store.set(attemptKey(), String(state.attempt));
    state.scoreText=right+"/"+total+tryLabel;
    if(FORM_URL && ENTRY.score){
      const u=new URL(FORM_URL);
      const add=(id,v)=>{ if(id) u.searchParams.set("entry."+id,v); };
      u.searchParams.set("usp","pp_url");
      add(ENTRY.name,state.name); add(ENTRY.period,state.period); add(ENTRY.date,state.dateLabel);
      add(ENTRY.warmup,state.title); add(ENTRY.score,state.scoreText);
      submit=`<a class="btn alt" href="${esc(u.toString())}" target="_blank" rel="noopener">Submit my score ↗</a>
              <p class="muted">Opens a form with your score filled in. Press <b>Submit</b> on the form.</p>`;
    } else {
      submit=`<p class="note">Write your score on your warm-up sheet: <b>${esc(state.title)} — ${esc(state.scoreText)}</b></p>`;
    }
  }
  app.innerHTML=`
    <div class="top"><p class="title">${esc(state.title)}${esc(tryLabel)}</p><span class="date">${esc(state.dateLabel)}</span></div>
    ${dots()}
    <p class="score">${right} / ${total}</p>
    ${submit}
    <ul class="review">${state.items.map((q,k)=>`<li>${state.results[k]?"✅":"❌"} ${esc(q.q)} <span class="muted">— ${esc(q.ch[q.correct])}</span></li>`).join("")}</ul>
    <div class="practice">
      ${state.scored?`<button class="btn" id="retry">Try a new set</button> `:""}
      <button class="btn ghost" id="more">Practice 5 more</button>
      <p class="muted" style="margin:6px 0 0">${state.scored?"A new set is new questions and counts as another try. ":""}Practice questions aren't scored.</p>
    </div>`;
  if(state.scored) document.getElementById("retry").onclick=()=>{
    state.attempt++; state.items=prep(randomSet(state.unit, state.items)); state.i=0; state.results=[]; ask();
  };
  document.getElementById("more").onclick=()=>practice(state.unit);
}

function noWarmup(msg, past, unit){
  const opts=past.slice(-15).reverse().map(d=>`<option value="${esc(d.wu)}|${esc(d.label)}">${esc(d.label)} — ${esc(d.wu)}</option>`).join("");
  app.innerHTML=`
    <p class="title" style="margin:0 0 6px">Warm Up</p>
    <p style="margin:0">${msg}</p>
    ${opts?`<label for="mk">Missed a warm-up? Make one up:</label>
      <select id="mk"><option value="">Choose a day…</option>${opts}</select>`:""}
    ${unit?`<div class="practice"><button class="btn ghost" id="more">Practice 5 ${esc(UNIT_NAMES[unit]||"")} questions</button> <span class="muted">(not scored)</span></div>`:""}`;
  const mk=document.getElementById("mk");
  if(mk) mk.onchange=()=>{ if(!mk.value) return; const [wu,label]=mk.value.split("|"); begin(wu,label); };
  const mo=document.getElementById("more");
  if(mo) mo.onclick=()=>practice(unit);
}

fetch(CSV_URL+(CSV_URL.includes("?")?"&":"?")+"t="+Date.now())
 .then(r=>{if(!r.ok)throw new Error(r.status);return r.text();})
 .then(txt=>{
  const rows=parseCSV(txt), head=rows[0]||[];
  const col=(name,fb)=>{const i=head.findIndex(h=>h.trim().toLowerCase()===name.toLowerCase());return i>=0?i:fb;};
  const cD=1, cT=col("Topic",2), cW=col("Warm Up",3), cC=col("Checkpoint",col("Quiz",4));
  const days=[];
  rows.slice(1).forEach(r=>{const d=toDate(r[cD]); if(d) days.push({d,label:fmtDate(d),topic:r[cT]||"",wu:(r[cW]||"").trim(),cp:(r[cC]||"").trim()});});
  const today=P.get("date")?new Date(P.get("date")+"T00:00:00"):new Date(); today.setHours(0,0,0,0);
  const past=days.filter(x=>x.d<today && parseWU(x.wu));
  const lastUnit=(()=>{const w=[...days].filter(x=>x.d<=today && parseWU(x.wu)).pop()||days.find(x=>parseWU(x.wu)); return w?parseWU(w.wu).unit:"";})();

  const asked=P.get("wu");                     // ?wu=WU%20C2U5.3a opens a specific warm-up
  if(asked && pickSet(asked)){
    const day=days.find(x=>x.wu===asked);
    return begin(asked, day?day.label:"");
  }
  const t=days.find(x=>x.d.getTime()===today.getTime());
  if(t && parseWU(t.wu)) return begin(t.wu,t.label);
  let msg="There's no warm-up today.";
  if(!t) msg="There's no class today, so there's no warm-up.";
  else if(t.cp) msg=`Today is <b>${esc(t.cp)}</b>, so there's no warm-up.`;
  else if(/no school/i.test(t.topic)) msg="There's no school today.";
  noWarmup(msg, past, lastUnit);
 })
 .catch(()=>{ app.innerHTML=`<p class="title">Warm Up</p><p>Couldn't load today's warm-up. Refresh the page or tell your teacher.</p>`; });
</script>
</body>
